<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zeron Sidebar Variants</title>
<!--
  PROTOTYPE — throwaway. Question: should Zeron's left sidebar (shell.rs render_chat_sidebar)
  move from a flat session list toward Orca's project → worktree → agents structure?
  Four sidebar variants inside a mock Zeron window, switchable with the bottom bar,
  ←/→ keys, or #A #B #C #D. Data mirrors Chat / Worktree / CheckoutDiff / ChangeRequestSummary.
  Zeron is GPUI (no URL routes), so this lives as HTML beside crates/ui instead of in-app.
-->
<style>
:root{
  color-scheme:dark;
  --ground:#140c1c;
  --frost:rgba(24,15,34,.78);
  --tone:rgba(255,255,255,.035);
  --card:rgba(10,6,16,.42);
  --text:#ece6f5;
  --muted:rgba(236,230,245,.55);
  --faint:rgba(236,230,245,.32);
  --border:rgba(236,230,245,.09);
  --border-strong:rgba(236,230,245,.16);
  --hover:rgba(255,255,255,.05);
  --selected:rgba(255,255,255,.09);
  --wash:rgba(255,255,255,.08);
  --busy:#8fa8ff;
  --accent:#c39bff;
  --danger:#f2727c;
  --success:#62d394;
  --warning:#e9b65a;
  --glyph:#e8875a;
  --add:#62d394;
  --del:#f2727c;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--text);font:13px/1.35 var(--sans);
  background-image:radial-gradient(1200px 700px at 15% 10%,#3b1f63 0,transparent 60%),radial-gradient(900px 600px at 90% 90%,#2a1650 0,transparent 60%);
  padding-inline:16px;padding-block:16px 72px;display:flex;align-items:stretch;justify-content:center;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:1.5px solid var(--accent);outline-offset:1px}
.win{
  width:100%;max-width:1320px;min-height:560px;border-radius:12px;overflow:hidden;
  background:var(--frost);backdrop-filter:blur(30px);border:1px solid var(--border-strong);
  box-shadow:0 30px 80px rgba(0,0,0,.45);display:flex;flex-direction:column;
}
.titlebar{height:38px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--border);flex:none}
.lights{display:flex;gap:7px}.lights i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.tb-btn{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.tb-btn:hover{background:var(--hover)}
.tb-title{display:flex;gap:8px;align-items:baseline;min-width:0;white-space:nowrap;overflow:hidden}
.tb-title b{font-weight:500}.tb-title span{color:var(--faint);font-size:12px}
.body{flex:1;display:flex;min-height:0}
.sidebar{width:272px;flex:none;background:var(--tone);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0;padding:22px 28px 14px}
.right{width:340px;flex:none;border-left:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
@media (max-width:1100px){.right{display:none}}
@media (max-width:720px){.main{display:none}.sidebar{width:100%}}

/* shared sidebar bits */
.sb-head{display:flex;gap:4px;padding:8px 8px 4px}
.sb-scroll{flex:1;overflow:auto;padding:4px 8px 8px}
.sb-foot{border-top:1px solid var(--border);padding:8px;display:flex;align-items:center;gap:8px}
.avatar{width:24px;height:24px;border-radius:50%;background:#5b3f86;display:grid;place-items:center;font-size:11px;font-weight:600}
.foot-name{font-size:12px}.foot-sub{font-size:10.5px;color:var(--faint)}
.pill-btn{height:29px;border-radius:8px;display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--muted)}
.pill-btn:hover{background:var(--hover);color:var(--text)}
.search{flex:1;height:29px;border-radius:8px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--faint)}
.search input{all:unset;flex:1;font-size:12px;color:var(--text)}
.kbd{font:10px var(--mono);color:var(--faint);border:1px solid var(--border);border-radius:4px;padding:0 4px}
.hicon{width:14px;height:14px;border-radius:4px;display:inline-grid;place-items:center;font:600 8.5px/1 var(--sans);flex:none;color:#140c1c}
.dot{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block}
.spin{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--glyph);border-right-color:transparent;animation:spin .8s linear infinite;flex:none;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.diff{font:11px var(--mono);white-space:nowrap}.diff .a{color:var(--add)}.diff .d{color:var(--del)}
.pr{font:10px/1 var(--mono);padding:3px 5px;border-radius:4px;background:var(--wash);color:var(--muted);white-space:nowrap}
.pr.open{color:var(--success)}.pr.merged{color:var(--accent)}.pr.draft{color:var(--faint)}.pr.fail{color:var(--danger)}
.fade{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row{border-radius:8px;cursor:pointer;transition:background .15s}
.row:hover{background:var(--hover)}.row.sel{background:var(--selected)}
.label{font-size:11px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase;padding:10px 6px 4px;display:flex;justify-content:space-between}
.chev{display:inline-block;width:10px;color:var(--faint);transition:transform .15s;font-size:9px}
.chev.closed{transform:rotate(-90deg)}
.ico{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* A: today */
.a-row{padding:6px 8px;display:flex;flex-direction:column;gap:2px;margin-bottom:2px}
.a-l1{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);gap:8px}
.a-status{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:500}
.a-l2{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(236,230,245,.82)}
.a-l3{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--faint)}

/* B: tree */
.b-proj{display:flex;align-items:center;gap:6px;padding:6px;font-weight:500;font-size:12.5px}
.b-proj .dev{color:var(--faint);font-weight:400;font-size:11px}
.b-proj .count{margin-left:auto;color:var(--faint);font-size:11px;font-weight:400}
.b-wt{padding:6px 8px 6px 20px;display:flex;flex-direction:column;gap:3px;margin-bottom:1px}
.b-wt-top{display:flex;align-items:center;gap:7px}
.b-wt-top .name{font-size:13px;color:rgba(236,230,245,.78)}
.b-wt.unread .name{color:var(--text);font-weight:600}
.b-wt-top .meta{margin-left:auto;display:flex;gap:6px;align-items:center}
.b-agent{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);padding-left:13px}
.b-agent .t{color:var(--faint);margin-left:auto;font:10.5px var(--mono)}
.pin{color:var(--warning);font-size:10px}
.menu{position:absolute;top:40px;right:8px;width:210px;background:#241833;border:1px solid var(--border-strong);border-radius:10px;padding:6px;z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.menu h6{margin:4px 6px;font-size:10.5px;color:var(--faint);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.menu label{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;font-size:12px;cursor:pointer}
.menu label:hover{background:var(--hover)}

/* C: cards */
.c-card{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 10px;margin-bottom:6px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:border-color .15s,background .15s}
.c-card:hover{border-color:var(--border-strong)}
.c-card.sel{border-color:rgba(195,155,255,.45);background:rgba(195,155,255,.07)}
.c-top{display:flex;align-items:center;gap:6px}
.c-top .name{font:500 12.5px var(--mono)}
.c-card.unread .name{color:var(--text)}.c-card:not(.unread) .name{color:rgba(236,230,245,.75)}
.c-agents{display:flex;flex-direction:column;gap:3px}
.c-agent{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);padding:3px 5px;border-radius:6px}
.c-agent:hover{background:var(--hover)}
.c-agent.sel{background:var(--selected);color:var(--text)}
.c-agent .t{margin-left:auto;font:10.5px var(--mono);color:var(--faint)}
.c-bar{height:3px;border-radius:2px;background:var(--wash);display:flex;overflow:hidden;flex:1}
.c-bar i{display:block;height:100%}
.c-foot{display:flex;align-items:center;gap:8px}

/* D: rail + list */
.d-wrap{display:flex;flex:1;min-height:0}
.d-rail{width:52px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.d-proj{width:34px;height:34px;border-radius:10px;background:var(--wash);display:grid;place-items:center;font-weight:600;font-size:12px;position:relative;color:var(--muted);transition:border-radius .15s,background .15s}
.d-proj:hover{border-radius:8px;background:var(--selected)}
.d-proj.sel{background:rgba(195,155,255,.22);color:var(--text);border-radius:8px}
.d-proj .badge{position:absolute;right:-3px;top:-3px;min-width:14px;height:14px;border-radius:7px;font:600 9px/14px var(--sans);padding:0 3px;color:#140c1c}
.d-proj.add{background:none;border:1px dashed var(--border-strong)}
.d-list{flex:1;display:flex;flex-direction:column;min-width:0}
.d-title{padding:12px 12px 4px;display:flex;align-items:baseline;gap:6px}
.d-title b{font-size:14px}.d-title span{font-size:11px;color:var(--faint)}
.d-row{padding:6px 8px;display:flex;gap:8px;align-items:flex-start;margin-bottom:1px}
.d-row .body2{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.d-row .l1{display:flex;gap:6px;align-items:center;font-size:12.5px}
.d-row .l2{font-size:11px;color:var(--faint);display:flex;gap:6px}
.d-row .ago{margin-left:auto;font:10.5px var(--mono);color:var(--faint)}

/* main mock */
.chat{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:14px;max-width:720px;width:100%;margin:0 auto}
.bubble{align-self:flex-end;background:var(--wash);border-radius:14px;padding:10px 14px;max-width:80%}
.tool{color:var(--faint);font-size:12px}
.composer{max-width:720px;width:100%;margin:0 auto;border:1px solid var(--border);background:var(--card);border-radius:14px;height:48px;display:flex;align-items:center;padding:0 14px;color:var(--faint);gap:12px}
.composer .sp{margin-left:auto;color:var(--muted);font-size:12px}
.statebox{max-width:720px;width:100%;margin:10px auto 0;font:10.5px/1.5 var(--mono);color:var(--faint);white-space:pre-wrap}
.rhead{height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);font-size:12px}
.rfile{display:flex;justify-content:space-between;padding:7px 12px;font:11.5px var(--mono);color:var(--muted);border-bottom:1px solid var(--border)}

/* switcher */
.switch{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;background:#faf7ff;color:#1a1024;box-shadow:0 10px 30px rgba(0,0,0,.5);font:600 12.5px var(--sans)}
.switch button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#1a1024}
.switch button:hover{background:#e9e1f5}
.switch .lbl{padding:0 10px;min-width:220px;text-align:center;white-space:nowrap}
.switch .lbl small{display:block;font-weight:400;font-size:10.5px;color:#6b5a80}
</style>

<div class="win">
  <div class="titlebar">
    <div class="lights"><i></i><i></i><i></i></div>
    <button class="tb-btn" title="Toggle sidebar"><svg class="ico" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/></svg></button>
    <button class="tb-btn" title="New session"><svg class="ico" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
    <div class="tb-title" id="tbTitle"></div>
  </div>
  <div class="body">
    <aside class="sidebar" id="sidebar" style="position:relative"></aside>
    <main class="main">
      <div class="chat" id="chat"></div>
      <div class="composer">Do anything… <span class="sp" id="compHarness"></span></div>
      <div class="statebox" id="state"></div>
    </main>
    <section class="right" id="right"></section>
  </div>
</div>

<div class="switch" role="toolbar" aria-label="Prototype variant switcher">
  <button id="prev" aria-label="Previous variant">←</button>
  <div class="lbl" id="vlabel"></div>
  <button id="next" aria-label="Next variant">→</button>
</div>

<script>
const HARNESS={
  claude:{c:'#e8875a',m:'✳',name:'Claude Code'},
  codex:{c:'#9fd0ff',m:'Cx',name:'Codex'},
  pi:{c:'#b9f29a',m:'π',name:'Pi'},
  cursor:{c:'#d9d4e2',m:'Cu',name:'Cursor'},
  devin:{c:'#7fe0cf',m:'Dv',name:'Devin'},
};
// Mirrors: Space(project) → Worktree{branch,checkout_id} → Chat[] ; CheckoutDiff{additions,deletions}; ChangeRequestSummary
const PROJECTS=[
  {id:'zeron',name:'zeron',device:'personal-metal',worktrees:[
    {id:'z-orca',branch:'zeron/orca-sidebar',pinned:true,diff:[412,88],files:14,pr:{n:451,state:'draft'},sessions:[
      {id:'s1',title:'Prototype Orca-style sidebar',h:'claude',st:'working',task:'rendering worktree card variant',t:'12m'},
      {id:'s2',title:'Audit sidebar row heights',h:'codex',st:'input',task:'needs approval: cargo test -p ui',t:'4m'}]},
    {id:'z-main',branch:'main',def:true,diff:null,pr:null,sessions:[
      {id:'s3',title:'Diff Sidebar Updates',h:'claude',st:'idle',t:'2h'}]},
    {id:'z-whale',branch:'zeron/whale-ui-thread',diff:[1204,377],files:31,pr:{n:445,state:'merged'},sessions:[
      {id:'s4',title:'Prepare whale transcript off UI thread',h:'claude',st:'done',unread:true,t:'38m'}]},
    {id:'z-transport',branch:'zeron/transport-reliability',diff:[96,40],files:5,pr:{n:443,state:'open',ci:'fail'},sessions:[
      {id:'s5',title:'Fix blank session revisits',h:'pi',st:'failed',task:'cargo test: 2 failed',t:'1h'},
      {id:'s6',title:'Trace attachment race',h:'codex',st:'idle',t:'3h'}]},
  ]},
  {id:'comet',name:'comet',device:'personal-metal',worktrees:[
    {id:'c-take',branch:'comet/takeover-cluster',diff:[9341,3630],files:80,pr:{n:46,state:'merged'},sessions:[
      {id:'s7',title:'Merge and cut v0.1.47',h:'claude',st:'working',task:'watching release run 31546676242',t:'6m'}]},
    {id:'c-main',branch:'main',def:true,diff:null,pr:null,sessions:[
      {id:'s8',title:'Triage flaky e2e',h:'cursor',st:'idle',t:'2d'}]},
  ]},
  {id:'pitodos',name:'pi-todos',device:'WALDO-LAPTOP',worktrees:[
    {id:'p-plane',branch:'feat/plane-sync',diff:[233,12],files:6,pr:{n:12,state:'open'},sessions:[
      {id:'s9',title:'Plane work item sync spike',h:'devin',st:'done',unread:true,t:'3h'},
      {id:'s10',title:'Due-date parsing',h:'pi',st:'working',task:'writing parser tests',t:'22m'}]},
    {id:'p-main',branch:'main',def:true,diff:null,pr:null,sessions:[
      {id:'s11',title:'Refresh README',h:'claude',st:'idle',t:'5d'}]},
  ]},
];
const ARCHIVED=27;
const ALL=[];PROJECTS.forEach(p=>p.worktrees.forEach(w=>w.sessions.forEach(s=>ALL.push({s,w,p}))));
const RANK={input:0,failed:1,working:2,done:3,idle:4};
const find=id=>ALL.find(x=>x.s.id===id);

const VARIANTS=[
  {k:'A',name:'Today',desc:'flat session list (current)'},
  {k:'B',name:'Orca tree',desc:'project → worktree → agents'},
  {k:'C',name:'Worktree cards',desc:'one card per worktree, pinned first'},
  {k:'D',name:'Project rail',desc:'rail + attention inbox'},
];
const S={variant:'B',selected:'s1',collapsed:new Set(),hideDefault:false,hideIdle:false,menu:false,railProject:'__inbox',query:''};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hicon=h=>`<span class="hicon" style="background:${HARNESS[h].c}" title="${HARNESS[h].name}">${HARNESS[h].m}</span>`;
function glyph(st){
  if(st==='working')return '<span class="spin"></span>';
  const c={input:'var(--accent)',failed:'var(--danger)',done:'var(--success)',idle:'rgba(236,230,245,.18)'}[st];
  return `<span class="dot" style="background:${c}"></span>`;
}
const WORD={working:'Working',input:'Input',failed:'Failed',done:'Done'};
function wtStatus(w){return w.sessions.map(s=>s.st).sort((a,b)=>RANK[a]-RANK[b])[0]}
const diffHtml=d=>d?`<span class="diff"><span class="a">+${d[0]}</span> <span class="d">−${d[1]}</span></span>`:'';
const prHtml=p=>p?`<span class="pr ${p.ci==='fail'?'fail':p.state}">#${p.n} ${p.ci==='fail'?'CI ✕':p.state}</span>`:'';
const foot=`<div class="sb-foot"><div class="avatar">W</div><div><div class="foot-name">Waldo</div><div class="foot-sub">Local only</div></div><button class="pill-btn" style="margin-left:auto" title="Settings"><svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4 5 11M11 5l1.4-1.4"/></svg></button></div>`;
const matches=x=>!S.query||(x.s.title+' '+x.w.branch+' '+x.p.name).toLowerCase().includes(S.query.toLowerCase());

/* ---------- A: today ---------- */
function renderA(){
  const rows=[...ALL].sort((a,b)=>(a.s.st==='idle')-(b.s.st==='idle'));
  return `<div class="sb-head"><button class="pill-btn" style="flex:1;background:var(--card);border:1px solid var(--border)"><svg class="ico" viewBox="0 0 16 16"><path d="M2 5h4l1.5 1.5H14V13H2z"/></svg><span style="color:var(--text)">All projects</span><span style="margin-left:auto">▾</span></button><button class="pill-btn" title="View options">⇅</button></div>
  <div class="sb-scroll">${rows.map(({s,w,p})=>`
    <div class="row a-row ${S.selected===s.id?'sel':''}" data-sel="${s.id}">
      <div class="a-l1"><span class="fade">${p.name} @ ${p.device}</span>${s.st!=='idle'?`<span class="a-status">${glyph(s.st)}${WORD[s.st]}</span>`:`<span>${s.t}</span>`}</div>
      <div class="a-l2">${hicon(s.h)}<span class="fade">${esc(s.title)}</span></div>
      ${w.def?'':`<div class="a-l3"><svg class="ico" style="width:11px" viewBox="0 0 16 16"><circle cx="4" cy="3.5" r="1.5"/><circle cx="4" cy="12.5" r="1.5"/><circle cx="12" cy="6" r="1.5"/><path d="M4 5v6M12 7.5c0 2-3 2.5-8 3.5"/></svg><span class="fade">${w.branch}</span><span style="margin-left:auto">${prHtml(w.pr)}</span></div>`}
    </div>`).join('')}
    <div class="label" style="margin-top:6px"><span>Archived (${ARCHIVED})</span><span>▸</span></div>
  </div>${foot}`;
}

/* ---------- B: Orca tree ---------- */
function renderB(){
  let html=`<div class="sb-head"><label class="search"><svg class="ico" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input id="q" placeholder="Search worktrees" value="${esc(S.query)}"><span class="kbd">⌘J</span></label><button class="pill-btn" id="filterBtn" title="Filter">⚲</button></div>`;
  if(S.menu)html+=`<div class="menu"><h6>Hide</h6>
    <label><input type="checkbox" id="hDef" ${S.hideDefault?'checked':''}> Default branch</label>
    <label><input type="checkbox" id="hIdle" ${S.hideIdle?'checked':''}> Idle worktrees</label>
    <h6>Sort</h6><label><input type="radio" checked> Attention first</label><label><input type="radio"> Last updated</label></div>`;
  html+=`<div class="sb-scroll">`;
  for(const p of PROJECTS){
    const closed=S.collapsed.has(p.id);
    let wts=[...p.worktrees].filter(w=>!(S.hideDefault&&w.def)&&!(S.hideIdle&&wtStatus(w)==='idle'))
      .filter(w=>w.sessions.some(s=>matches({s,w,p})))
      .sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||RANK[wtStatus(a)]-RANK[wtStatus(b)]);
    const live=p.worktrees.flatMap(w=>w.sessions).filter(s=>s.st==='working').length;
    html+=`<div class="row b-proj" data-toggle="${p.id}"><span class="chev ${closed?'closed':''}">▼</span>${p.name}<span class="dev">@ ${p.device}</span><span class="count">${live?`<span class="spin" style="width:8px;height:8px"></span> `:''}${p.worktrees.length}</span></div>`;
    if(closed)continue;
    for(const w of wts){
      const unread=w.sessions.some(s=>s.unread);
      const sel=w.sessions.some(s=>s.id===S.selected);
      html+=`<div class="row b-wt ${unread?'unread':''} ${sel?'sel':''}" data-sel="${w.sessions[0].id}">
        <div class="b-wt-top">${glyph(wtStatus(w))}<span class="name fade">${w.branch}</span>${w.pinned?'<span class="pin" title="Pinned">●</span>':''}<span class="meta">${diffHtml(w.diff)}</span></div>
        ${w.sessions.filter(s=>s.st!=='idle'||w.sessions.length>1).map(s=>`<div class="b-agent" data-sel="${s.id}" style="${S.selected===s.id?'color:var(--text)':''}">${hicon(s.h)}<span class="fade">${esc(s.task||s.title)}</span><span class="t">${s.t}</span></div>`).join('')}
        ${w.pr?`<div style="padding-left:13px">${prHtml(w.pr)}</div>`:''}
      </div>`;
    }
  }
  return html+`<div class="label" style="margin-top:6px"><span>Archived (${ARCHIVED})</span><span>▸</span></div></div>${foot}`;
}

/* ---------- C: worktree cards ---------- */
function card(w,p){
  const unread=w.sessions.some(s=>s.unread), sel=w.sessions.some(s=>s.id===S.selected);
  const tot=w.diff?w.diff[0]+w.diff[1]:0;
  return `<div class="c-card ${unread?'unread':''} ${sel?'sel':''}" data-sel="${w.sessions[0].id}">
    <div class="c-top">${glyph(wtStatus(w))}<span class="name fade">${w.branch}</span><span style="margin-left:auto">${prHtml(w.pr)}</span></div>
    <div class="c-agents">${w.sessions.map(s=>`<div class="c-agent ${S.selected===s.id?'sel':''}" data-sel="${s.id}">${hicon(s.h)}<span class="fade">${esc(s.task||s.title)}</span><span class="t">${s.st==='idle'?s.t:(WORD[s.st]+' · '+s.t)}</span></div>`).join('')}</div>
    ${w.diff?`<div class="c-foot"><div class="c-bar"><i style="width:${w.diff[0]/tot*100}%;background:var(--add)"></i><i style="width:${w.diff[1]/tot*100}%;background:var(--del)"></i></div>${diffHtml(w.diff)}<span style="font-size:10.5px;color:var(--faint)">${w.files} files</span></div>`:''}
  </div>`;
}
function renderC(){
  const pinned=[];PROJECTS.forEach(p=>p.worktrees.forEach(w=>w.pinned&&pinned.push([w,p])));
  let html=`<div class="sb-head"><button class="pill-btn" style="flex:1;background:var(--card);border:1px solid var(--border);color:var(--text)">＋ New worktree</button><button class="pill-btn" title="Search">⌕</button></div><div class="sb-scroll">`;
  html+=`<div class="label"><span>Pinned</span></div>`+pinned.map(([w,p])=>card(w,p)).join('');
  for(const p of PROJECTS){
    const closed=S.collapsed.has(p.id);
    html+=`<div class="label row" data-toggle="${p.id}" style="cursor:pointer"><span><span class="chev ${closed?'closed':''}">▼</span> ${p.name} <span style="text-transform:none;letter-spacing:0">@ ${p.device}</span></span><span>${p.worktrees.length}</span></div>`;
    if(!closed)html+=p.worktrees.filter(w=>!w.pinned).sort((a,b)=>RANK[wtStatus(a)]-RANK[wtStatus(b)]).map(w=>card(w,p)).join('');
  }
  return html+`</div>${foot}`;
}

/* ---------- D: project rail + inbox ---------- */
function renderD(){
  const attn=x=>x.s.st==='input'||x.s.st==='failed'||x.s.unread;
  const badge=list=>{const n=list.filter(attn).length;return n?`<span class="badge" style="background:var(--accent)">${n}</span>`:''};
  let rail=`<button class="d-proj ${S.railProject==='__inbox'?'sel':''}" data-rail="__inbox" title="Inbox">⌂${badge(ALL)}</button><div style="width:20px;height:1px;background:var(--border)"></div>`;
  rail+=PROJECTS.map(p=>`<button class="d-proj ${S.railProject===p.id?'sel':''}" data-rail="${p.id}" title="${p.name} @ ${p.device}">${p.name.slice(0,2).toUpperCase()}${badge(ALL.filter(x=>x.p===p))}</button>`).join('');
  rail+=`<button class="d-proj add" title="New project">＋</button>`;
  let list='';
  if(S.railProject==='__inbox'){
    const groups=[['Needs you',x=>x.s.st==='input'||x.s.st==='failed'],['Running',x=>x.s.st==='working'],['Finished, unread',x=>x.s.st==='done'&&x.s.unread]];
    list=`<div class="d-title"><b>Inbox</b><span>across ${PROJECTS.length} projects</span></div><div class="sb-scroll">`+groups.map(([g,f])=>{
      const items=ALL.filter(f);if(!items.length)return '';
      return `<div class="label"><span>${g}</span><span>${items.length}</span></div>`+items.map(({s,w,p})=>`<div class="row d-row ${S.selected===s.id?'sel':''}" data-sel="${s.id}">${glyph(s.st)}<div class="body2"><div class="l1">${hicon(s.h)}<span class="fade">${esc(s.title)}</span><span class="ago">${s.t}</span></div><div class="l2"><span class="fade">${p.name} / ${w.branch}</span></div>${s.task?`<div class="l2" style="color:${s.st==='working'?'var(--muted)':s.st==='failed'?'var(--danger)':'var(--accent)'}">${esc(s.task)}</div>`:''}</div></div>`).join('');
    }).join('')+`</div>`;
  }else{
    const p=PROJECTS.find(x=>x.id===S.railProject);
    list=`<div class="d-title"><b>${p.name}</b><span>@ ${p.device}</span></div><div class="sb-scroll">`+p.worktrees.map(w=>`
      <div class="label"><span class="fade" style="text-transform:none;letter-spacing:0;font-family:var(--mono)">${w.def?'⌂ ':''}${w.branch}</span><span>${diffHtml(w.diff)}</span></div>
      ${w.sessions.map(s=>`<div class="row d-row ${S.selected===s.id?'sel':''}" data-sel="${s.id}">${glyph(s.st)}<div class="body2"><div class="l1">${hicon(s.h)}<span class="fade" style="${s.unread?'font-weight:600':''}">${esc(s.title)}</span><span class="ago">${s.t}</span></div>${s.task?`<div class="l2">${esc(s.task)}</div>`:''}</div></div>`).join('')}
      ${w.pr?`<div style="padding:0 8px 4px 22px">${prHtml(w.pr)}</div>`:''}`).join('')+`</div>`;
  }
  return `<div class="d-wrap"><nav class="d-rail">${rail}</nav><div class="d-list">${list}</div></div>${foot}`;
}

/* ---------- shell ---------- */
function renderMain(){
  const {s,w,p}=find(S.selected);
  document.getElementById('tbTitle').innerHTML=`${hicon(s.h)}<b>${esc(s.title)}</b><span>${w.branch} @ ${p.device}</span>`;
  document.getElementById('compHarness').textContent=HARNESS[s.h].name+' · High';
  document.getElementById('chat').innerHTML=`
    <div class="bubble">${s.st==='input'?'Run the ui tests before touching the row heights.':'Keep going, and tell me when the sidebar compiles.'}</div>
    <div class="tool">▸ Ran 6 commands · edited 3 files · read 9 files</div>
    <div>${s.task?esc(s.task[0].toUpperCase()+s.task.slice(1))+'…':'Finished. Summary is above; nothing is pending on this session.'}</div>
    ${s.st==='input'?'<div class="tool" style="color:var(--accent)">● Waiting for your approval</div>':''}
    ${s.st==='failed'?'<div class="tool" style="color:var(--danger)">● Turn failed · retry available</div>':''}`;
  document.getElementById('right').innerHTML=`<div class="rhead"><b style="font-weight:500">Branch changes</b><span style="color:var(--faint)" class="fade">${w.branch}</span></div>
    <div class="rfile" style="color:var(--text)"><span>${w.files||0} changed files</span>${diffHtml(w.diff)||'<span>clean</span>'}</div>
    ${w.diff?['crates/ui/src/shell.rs','crates/ui/src/shell/spaces.rs','crates/ui/src/settings.rs','crates/proto/src/entities.rs'].map((f,i)=>`<div class="rfile"><span class="fade">${f}</span><span class="diff"><span class="a">+${Math.round(w.diff[0]/(i+2))}</span> <span class="d">−${Math.round(w.diff[1]/(i+3))}</span></span></div>`).join(''):''}`;
  document.getElementById('state').textContent=`variant=${S.variant}  selected=${s.id} (${p.name}/${w.branch}, ${s.st})\ncollapsed=[${[...S.collapsed]}]  hideDefault=${S.hideDefault}  hideIdle=${S.hideIdle}  rail=${S.railProject}  query="${S.query}"`;
}
function render(){
  const sb=document.getElementById('sidebar');
  const scroll=sb.querySelector('.sb-scroll');const top=scroll?scroll.scrollTop:0;
  sb.innerHTML={A:renderA,B:renderB,C:renderC,D:renderD}[S.variant]();
  const ns=sb.querySelector('.sb-scroll');if(ns)ns.scrollTop=top;
  const v=VARIANTS.find(v=>v.k===S.variant);
  document.getElementById('vlabel').innerHTML=`${v.k} — ${v.name}<small>${v.desc}</small>`;
  renderMain();
  const q=document.getElementById('q');
  if(q){q.oninput=e=>{S.query=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)};}
  const hd=document.getElementById('hDef');if(hd)hd.onchange=e=>{S.hideDefault=e.target.checked;render()};
  const hi=document.getElementById('hIdle');if(hi)hi.onchange=e=>{S.hideIdle=e.target.checked;render()};
  const fb=document.getElementById('filterBtn');if(fb)fb.onclick=()=>{S.menu=!S.menu;render()};
}
document.getElementById('sidebar').addEventListener('click',e=>{
  const t=e.target.closest('[data-toggle]');if(t){const id=t.dataset.toggle;S.collapsed.has(id)?S.collapsed.delete(id):S.collapsed.add(id);render();return}
  const r=e.target.closest('[data-rail]');if(r){S.railProject=r.dataset.rail;render();return}
  const s=e.target.closest('[data-sel]');if(s){S.selected=s.dataset.sel;const x=find(S.selected);if(x)x.s.unread=false;render()}
});
function go(k){S.variant=k;S.menu=false;try{history.replaceState(null,'','#'+k)}catch(_){location.hash=k}render()}
function step(d){const i=VARIANTS.findIndex(v=>v.k===S.variant);go(VARIANTS[(i+d+VARIANTS.length)%VARIANTS.length].k)}
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);
addEventListener('keydown',e=>{
  const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable))return;
  if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);
});
const h=location.hash.slice(1).toUpperCase();if(VARIANTS.some(v=>v.k===h))S.variant=h;
render();
</script>

</body></html>
